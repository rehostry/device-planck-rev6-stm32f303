#
# HALucinator reads `logging.cfg` from the process CWD if one exists
# (hal_log.py), and this device is spawned with CWD == this configs dir, so this
# file is the one that takes effect.  The shipped default leaves root at ERROR,
# which hides `halucinator.backends.unicorn_backend`'s INFO records -- including
# `dump_pc_sample()`, the ONLY way to find out where a stripped, symbol-less
# image is spinning.  Without this file HAL_PC_SAMPLE=1 appears to do nothing at
# all: the histogram is collected and then logged to a logger nobody configured.
[loggers]
keys=root,halucinator.main,HAL_LOG,halucinator.backends.unicorn_backend

[handlers]
keys=consoleHandler

[formatters]
keys=sampleFormatter

[logger_root]
level=ERROR
handlers=consoleHandler

[logger_halucinator.main]
level=INFO
handlers=consoleHandler
propagate=0
qualname=halucinator.main

[logger_HAL_LOG]
level=INFO
handlers=consoleHandler
propagate=0
qualname=HAL_LOG

# VERBOSE TWIN of logging.cfg -- `cp logging-verbose.cfg logging.cfg`.
# INFO here enables the per-exception trace and HAL_PC_SAMPLE's
# histogram, at a real throughput cost.
# WARNING, deliberately. This logger carries two INFO records per delivered
# exception, and a tickless ChibiOS guest takes one exception per armed
# deadline -- on a sibling device that was 3.2 GB of log in an hour and ~4x
# throughput lost (playbook trap 196). Dropping the file entirely is NOT the
# answer: `inject_irq(N): vector table slot ... is zero or unmapped` is on this
# logger at WARNING and is how a misdirected interrupt is found (trap 111).
# For the full trace and HAL_PC_SAMPLE's histogram (both INFO), run
# `cp logging-verbose.cfg logging.cfg` in this directory.
[logger_halucinator.backends.unicorn_backend]
level=INFO
handlers=consoleHandler
propagate=0
qualname=halucinator.backends.unicorn_backend

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=sampleFormatter
args=(sys.stdout,)

[formatter_sampleFormatter]
format=%(name)s|%(levelname)s|  %(message)s
